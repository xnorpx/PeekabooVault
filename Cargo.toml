[workspace]
resolver = "2"

members = [
    "peeka_boo_vault",
    "onvif/onvif",
    "onvif/schema",
    "onvif/transport",
    "onvif/validate",
    "onvif/xsd_rs/common",
    "onvif/xsd_rs/metadatastream",
    "onvif/xsd_rs/onvif_xsd",
    "onvif/xsd_rs/radiometry",
    "onvif/xsd_rs/rules",
    "onvif/xsd_rs/soap_envelope",
    "onvif/xsd_rs/types",
    "onvif/xsd_rs/xmlmime",
    "onvif/xsd_rs/xop",
    "onvif/wsdl_rs/accesscontrol",
    "onvif/wsdl_rs/accessrules",
    "onvif/wsdl_rs/actionengine",
    "onvif/wsdl_rs/advancedsecurity",
    "onvif/wsdl_rs/analytics",
    "onvif/wsdl_rs/authenticationbehavior",
    "onvif/wsdl_rs/b_2",
    "onvif/wsdl_rs/bf_2",
    "onvif/wsdl_rs/credential",
    "onvif/wsdl_rs/deviceio",
    "onvif/wsdl_rs/devicemgmt",
    "onvif/wsdl_rs/display",
    "onvif/wsdl_rs/doorcontrol",
    "onvif/wsdl_rs/event",
    "onvif/wsdl_rs/imaging",
    "onvif/wsdl_rs/media",
    "onvif/wsdl_rs/media2",
    "onvif/wsdl_rs/provisioning",
    "onvif/wsdl_rs/ptz",
    "onvif/wsdl_rs/receiver",
    "onvif/wsdl_rs/recording",
    "onvif/wsdl_rs/replay",
    "onvif/wsdl_rs/schedule",
    "onvif/wsdl_rs/search",
    "onvif/wsdl_rs/t_1",
    "onvif/wsdl_rs/thermal",
    "onvif/wsdl_rs/uplink",
    "onvif/wsdl_rs/ws_addr",
    "onvif/wsdl_rs/ws_discovery",
    "onvif/wsdl_rs/xml_xsd",
    "onvif/xsd-macro-utils",
    "onvif/xsd-types",
    "onvif/xsd-parser",
    "onvif/wsdl-parser",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# External dependencies
anyhow = "1"
async-recursion = "1"
async-trait = "0.1"
base64 = "0.22"
bigdecimal = "0.4"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
digest_auth = "0.3"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
Inflector = "0.11"
num-bigint = "0.4"
nonzero_ext = "0.3"
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false }
roxmltree = "0.21"
sha1 = "0.10"
syn = { version = "2", features = ["full", "extra-traits"] }
text-diff = "0.4"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
xml-rs = "0.8"
xmltree = "0.12"
yaserde = "0.12"
yaserde_derive = "0.12"

# xsd-parser-rs crates (now local)
xsd-macro-utils = { path = "onvif/xsd-macro-utils" }
xsd-types = { path = "onvif/xsd-types" }
xsd-parser = { path = "onvif/xsd-parser" }
wsdl-parser = { path = "onvif/wsdl-parser" }

# Dev dependencies
assert_approx_eq = "1"
dotenv = "0.15"
structopt = "0.3"
tracing-subscriber = "0.3"

# Internal crates
validate = { path = "onvif/validate" }
transport = { path = "onvif/transport" }
schema = { version = "0.1.0", path = "onvif/schema", default-features = false }

# xsd_rs crates
common = { path = "onvif/xsd_rs/common" }
metadatastream = { path = "onvif/xsd_rs/metadatastream" }
onvif = { package = "onvif-xsd", path = "onvif/xsd_rs/onvif_xsd" }
radiometry = { path = "onvif/xsd_rs/radiometry" }
rules = { path = "onvif/xsd_rs/rules" }
soap_envelope = { path = "onvif/xsd_rs/soap_envelope" }
types = { path = "onvif/xsd_rs/types" }
xmlmime = { path = "onvif/xsd_rs/xmlmime" }
xop = { path = "onvif/xsd_rs/xop" }

# wsdl_rs crates
accesscontrol = { path = "onvif/wsdl_rs/accesscontrol" }
accessrules = { path = "onvif/wsdl_rs/accessrules" }
actionengine = { path = "onvif/wsdl_rs/actionengine" }
advancedsecurity = { path = "onvif/wsdl_rs/advancedsecurity" }
analytics = { path = "onvif/wsdl_rs/analytics" }
authenticationbehavior = { path = "onvif/wsdl_rs/authenticationbehavior" }
b_2 = { path = "onvif/wsdl_rs/b_2" }
bf_2 = { path = "onvif/wsdl_rs/bf_2" }
credential = { path = "onvif/wsdl_rs/credential" }
deviceio = { path = "onvif/wsdl_rs/deviceio" }
devicemgmt = { path = "onvif/wsdl_rs/devicemgmt" }
display = { path = "onvif/wsdl_rs/display" }
doorcontrol = { path = "onvif/wsdl_rs/doorcontrol" }
event = { path = "onvif/wsdl_rs/event" }
imaging = { path = "onvif/wsdl_rs/imaging" }
media = { path = "onvif/wsdl_rs/media" }
media2 = { path = "onvif/wsdl_rs/media2" }
provisioning = { path = "onvif/wsdl_rs/provisioning" }
ptz = { path = "onvif/wsdl_rs/ptz" }
receiver = { path = "onvif/wsdl_rs/receiver" }
recording = { path = "onvif/wsdl_rs/recording" }
replay = { path = "onvif/wsdl_rs/replay" }
schedule = { path = "onvif/wsdl_rs/schedule" }
search = { path = "onvif/wsdl_rs/search" }
t_1 = { path = "onvif/wsdl_rs/t_1" }
thermal = { path = "onvif/wsdl_rs/thermal" }
uplink = { path = "onvif/wsdl_rs/uplink" }
ws_addr = { path = "onvif/wsdl_rs/ws_addr" }
ws_discovery = { path = "onvif/wsdl_rs/ws_discovery" }
xml_xsd = { path = "onvif/wsdl_rs/xml_xsd" }

[workspace.lints.rust]
# Allow non_local_definitions warning from yaserde_derive macros until upstream fixes it
non_local_definitions = "allow"
redundant_imports = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"

[workspace.lints.clippy]
as_ptr_cast_mut = "deny"
branches_sharing_code = "deny"
clear_with_drain = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
equatable_if_let = "deny"
fallible_impl_from = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
iter_with_drain = "deny"
large_stack_frames = "deny"
missing_const_for_fn = "deny"
mutex_integer = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
nonstandard_macro_braces = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
redundant_pub_crate = "deny"
semicolon_if_nothing_returned = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
suboptimal_flops = "deny"
suspicious_operation_groupings = "deny"
trailing_empty_array = "deny"
uninlined_format_args = "deny"
use_self = "deny"

[profile.dev]
# https://doc.rust-lang.org/cargo/reference/profiles.html#dev
debug = true

[profile.release]
# https://doc.rust-lang.org/cargo/reference/profiles.html#release
codegen-units = 1
overflow-checks = true
panic = 'abort'
# Enable line-tables debug info for stack traces, but not full debug symbols.
# Use "full" if you need full debugging, or false/0 for smallest binary size.
debug = "line-tables-only"
# Split debuginfo into its own file to reduce binary size.
split-debuginfo = "packed"

[profile.release-lto]
inherits = 'release'
lto = 'fat'

[profile.release-min]
inherits = 'release'
codegen-units = 1
overflow-checks = false
panic = 'abort'
debug = false           # No debug info
lto = 'fat'             # Maximum LTO
strip = true            # Auto-strip
opt-level = 'z'         # Size optimization

[profile.bench]
# https://doc.rust-lang.org/cargo/reference/profiles.html#bench
# See function names in profiling reports.
# 2/true is too much, 0 is not enough, 1 is just right for back traces
debug = 1
